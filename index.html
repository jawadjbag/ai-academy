<!doctype html>
<html lang="fr" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AI Academy" />
  <title>AI Academy</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">AI ACADEMY</div>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <button id="themeBtn" class="icon-btn" aria-label="Changer le thème">◐</button>
    </header>

    <main id="app" class="content"></main>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>Accueil</small></button>
      <button data-route="learn" class="nav-item"><span>◎</span><small>Cours</small></button>
      <button data-route="lab" class="nav-item"><span>⚙</span><small>Lab</small></button>
      <button data-route="knowledge" class="nav-item"><span>◇</span><small>Savoir</small></button>
      <button data-route="notes" class="nav-item"><span>✎</span><small>Notes</small></button>
    </nav>
  </div>

  <template id="toastTemplate"><div class="toast"></div></template>
  <script src="app.js"></script>
</body>
</html>
